[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "verification-core"
version = "0.1.0"
description = "Generic core for externally verifiable information platforms: sources, provenance, hashes, signed manifests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Evidence Platform contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pypdf>=5.0",
  "cryptography>=43",
  "rfc8785>=0.1.4",
  "typer>=0.12",
  "uuid-utils>=0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4", "jsonschema>=4.23"]

[project.scripts]
vcore = "verification_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/verification_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["verification_core", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/verification_core/migrations/versions/*" = ["E501"]
